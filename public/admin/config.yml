backend:
  name: github
  repo: satoshi3090/afrus
  branch: main
  site_domain: afrusculture.netlify.app
  auth_scope: repo
  use_graphql: true
  squash_merges: true
  commit_messages:
    create: 'content: create {{collection}} - {{slug}}'
    update: 'content: update {{collection}} - {{slug}}'
    delete: 'content: delete {{collection}} - {{slug}}'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete media {{path}}'

local_backend: true

logo_url: /afrus-logo-transparent-v3.png
locale: fr
show_preview_links: true

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: multilingual_content
    label: Tous les textes et traductions du site
    label_singular: Groupe de traductions
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    fields:
      - { label: Page or section namespace, name: namespace, widget: hidden }
      - { label: Nom administratif en français, name: adminLabelFr, widget: hidden }
      - label: Editable text
        name: entries
        widget: list
        summary: '{{fields.fr}}'
        add_to_top: true
        fields:
          - { label: Translation key, name: key, widget: string, hint: 'Keep existing keys unchanged. New keys may be added for new content.' }
          - { label: English, name: en, widget: text }
          - { label: French, name: fr, widget: text }
          - { label: Russian, name: ru, widget: text }

  # Page-specific views make major business areas easy to find. These edit the
  # same translation files as the complete collection above.
  - name: trade_page_content
    label: Trade Page Content
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: tradePage }
    fields: &page_translation_fields
      - { label: Page namespace, name: namespace, widget: hidden }
      - { label: Nom administratif en français, name: adminLabelFr, widget: hidden }
      - label: Editable page content
        name: entries
        widget: list
        summary: '{{fields.fr}}'
        add_to_top: true
        fields:
          - { label: Content key, name: key, widget: string, hint: 'Keep existing keys unchanged.' }
          - { label: English, name: en, widget: text }
          - { label: French, name: fr, widget: text }
          - { label: Russian, name: ru, widget: text }

  - name: business_russia_content
    label: Business in Russia Content
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: businessRussia }
    fields: *page_translation_fields

  - name: business_africa_content
    label: Business in Africa Content
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: businessAfrica }
    fields: *page_translation_fields

  - name: export_import_content
    label: Export and Import Content
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: exportImportPage }
    fields: *page_translation_fields

  - name: economic_forum_content
    label: Economic Forum Content
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: forumPage }
    fields: *page_translation_fields

  - name: events_page_content
    label: Events Page Text
    folder: src/content/translations
    create: false
    delete: false
    extension: json
    format: json
    identifier_field: namespace
    summary: '{{adminLabelFr}}'
    filter: { field: namespace, value: eventsPage }
    fields: *page_translation_fields

  - name: store_categories
    label: Store Categories
    label_singular: Store Category
    folder: src/content/store/categories
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{nameI18n.fr}}'
    fields:
      - { label: Stable ID, name: id, widget: string, hint: 'Use lowercase letters and hyphens. Do not change after products use it.' }
      - { label: Category name, name: name, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Translated category name, name: nameI18n, widget: object, required: false, collapsed: true, fields: [{ label: English, name: en, widget: string, required: false }, { label: French, name: fr, widget: string, required: false }, { label: Russian, name: ru, widget: string, required: false }] }
      - { label: Translated description, name: descriptionI18n, widget: object, required: false, collapsed: true, fields: [{ label: English, name: en, widget: text, required: false }, { label: French, name: fr, widget: text, required: false }, { label: Russian, name: ru, widget: text, required: false }] }
      - { label: Cover image, name: image, widget: image }
      - { label: Icon or emoji, name: icon, widget: string }
      - { label: Display order, name: itemCount, widget: number, value_type: int, min: 0, default: 0 }

  - name: store_subcategories
    label: Store Subcategories
    label_singular: Store Subcategory
    folder: src/content/store/subcategories
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{nameI18n.fr}}'
    fields:
      - { label: Stable ID, name: id, widget: string, hint: 'Use category-id--subcategory-name.' }
      - { label: Parent category, name: categoryId, widget: relation, collection: store_categories, search_fields: ['name', 'id'], value_field: id, display_fields: ['name'] }
      - { label: Subcategory name, name: name, widget: string }
      - { label: Translated subcategory name, name: nameI18n, widget: object, required: false, collapsed: true, fields: [{ label: English, name: en, widget: string, required: false }, { label: French, name: fr, widget: string, required: false }, { label: Russian, name: ru, widget: string, required: false }] }

  - name: store_products
    label: Store Products
    label_singular: Store Product
    folder: src/content/store/products
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: id
    slug: '{{id}}'
    summary: '{{titleI18n.fr}} — ₽{{priceRub}} RUB'
    fields:
      - { label: Stable product ID, name: id, widget: string, hint: 'Use lowercase letters and hyphens.' }
      - { label: Legacy title fallback, name: title, widget: hidden, default: '' }
      - { label: Product title, name: titleI18n, widget: object, fields: [{ label: English, name: en, widget: string }, { label: French, name: fr, widget: string }, { label: Russian, name: ru, widget: string }] }
      - { label: Category, name: categoryId, widget: relation, collection: store_categories, search_fields: ['name', 'id'], value_field: id, display_fields: ['name'] }
      - { label: Subcategory, name: subcategoryId, widget: relation, collection: store_subcategories, search_fields: ['name', 'id'], value_field: id, display_fields: ['name'], required: false }
      - { label: Legacy category fallback, name: category, widget: hidden, default: '' }
      - { label: Legacy subcategory fallback, name: subcategory, widget: hidden, default: '' }
      - { label: Prix principal en RUB, name: priceRub, widget: number, value_type: float, min: 0, hint: 'Prix principal obligatoire affiché aux clients en roubles russes.' }
      - { label: Prix de référence en USD, name: priceUsd, widget: number, value_type: float, min: 0, hint: 'Prix secondaire indicatif affiché entre parenthèses.' }
      - { label: Origin, name: origin, widget: string }
      - { label: Legacy description fallback, name: description, widget: hidden, default: '' }
      - { label: Product description, name: descriptionI18n, widget: object, fields: [{ label: English, name: en, widget: text }, { label: French, name: fr, widget: text }, { label: Russian, name: ru, widget: text }] }
      - { label: Main image, name: image, widget: image, hint: 'Any image shape is supported. For the best storefront presentation, use a clear square product photo with the product centered and some space around its edges.' }
      - { label: Gallery images, name: galleryImages, widget: list, required: false, field: { label: Image, name: value, widget: image, required: false } }
      - { label: In stock, name: inStock, widget: boolean, default: true }
      - { label: Inventory count, name: inventoryCount, widget: number, value_type: int, min: 0, default: 0 }
      - { label: Availability label, name: availabilityStatus, widget: string, required: false, hint: 'Enter any status the administrator wants customers to see.' }
      - { label: Featured product, name: isFeatured, widget: boolean, default: false, required: false }
      - { label: New arrival, name: isNewArrival, widget: boolean, default: false, required: false }
      - { label: Rating, name: rating, widget: number, value_type: float, min: 0, max: 5, default: 5 }
      - { label: Badge, name: badge, widget: string, required: false }
      - { label: Translated badge, name: badgeI18n, widget: object, required: false, collapsed: true, fields: [{ label: English, name: en, widget: string, required: false }, { label: French, name: fr, widget: string, required: false }, { label: Russian, name: ru, widget: string, required: false }] }
      - { label: Brand, name: brand, widget: string, required: false }
      - { label: Material, name: material, widget: string, required: false }
      - { label: Available sizes, name: availableSizes, widget: list, required: false, field: { label: Size, name: value, widget: string, required: false } }
      - label: Specifications
        name: specifications
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string, required: false }
          - { label: Value, name: value, widget: string, required: false }

