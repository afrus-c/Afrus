<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Fabric Lighting Overlay -->
    <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <pattern id="clothWeave" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="2" y="2" width="2" height="2" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Red top band -->
  <rect x="0" y="0" width="900" height="200" fill="#D21034"/>
  <!-- Black middle band -->
  <rect x="0" y="200" width="900" height="200" fill="#000000"/>
  <!-- Green bottom band -->
  <rect x="0" y="400" width="900" height="200" fill="#00853D"/>

  <!-- Cloth Weave Texture -->
  <rect x="0" y="0" width="900" height="600" fill="url(#clothWeave)"/>

  <!-- Fabric Texture & Waving Overlay -->
  <rect x="0" y="0" width="900" height="600" fill="url(#waveHighlight)" style="mix-blend-mode: overlay;"/>

  <!-- Outer Hem & Border -->
  <rect x="0" y="0" width="900" height="600" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="6"/>
</svg>
