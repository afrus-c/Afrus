<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Fabric Lighting Overlay -->
    <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Sun Glow Filter -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3A8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#E2B400" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E2B400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Flag Stripes -->
  <!-- Top 50%: Blue #00A3E0 -->
  <rect x="0" y="0" width="900" height="300" fill="#00A3E0"/>
  <!-- Middle 25%: Yellow #FAD105 -->
  <rect x="0" y="300" width="900" height="150" fill="#FAD105"/>
  <!-- Bottom 25%: Green #20603D -->
  <rect x="0" y="450" width="900" height="150" fill="#20603D"/>

  <!-- Rwanda Sun Emblem (Upper Right Corner of Blue Band) -->
  <!-- Center: x=750, y=140 -->
  <g transform="translate(750, 140)">
    <!-- Soft background glow for realism -->
    <circle cx="0" cy="0" r="85" fill="url(#sunGlow)"/>

    <!-- 24 Sun Rays -->
    <g fill="#E2B400">
      <!-- 24 rays rotated by 15 deg each -->
      <path d="M 0 -72 L 6 -42 L -6 -42 Z"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(15)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(30)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(45)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(60)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(75)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(90)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(105)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(120)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(135)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(150)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(165)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(180)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(195)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(210)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(225)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(240)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(255)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(270)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(285)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(300)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(315)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(330)"/>
      <path d="M 0 -72 L 6 -42 L -6 -42 Z" transform="rotate(345)"/>
    </g>

    <!-- Ring separating disk and rays -->
    <circle cx="0" cy="0" r="41" fill="none" stroke="#E2B400" stroke-width="3"/>
    <circle cx="0" cy="0" r="37" fill="#E2B400"/>
  </g>

  <!-- Fabric Texture & Waving Overlay -->
  <rect x="0" y="0" width="900" height="600" fill="url(#waveHighlight)" style="mix-blend-mode: overlay;"/>

  <!-- Subtle Outer Border/Stitching Shadow -->
  <rect x="0" y="0" width="900" height="600" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="6"/>
</svg>
