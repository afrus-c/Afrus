<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Deep Emerald Radial Background -->
    <radialGradient id="unityBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#114B32"/>
      <stop offset="50%" stop-color="#0A2E1F"/>
      <stop offset="100%" stop-color="#04120C"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDF00" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="900" height="600" fill="url(#unityBg)"/>

  <!-- Top & Bottom Tri-Color Gold/Red/Green Accent Bars -->
  <rect x="0" y="0" width="900" height="18" fill="#D21034"/>
  <rect x="0" y="18" width="900" height="12" fill="#FFD700"/>
  <rect x="0" y="30" width="900" height="18" fill="#00853D"/>

  <rect x="0" y="552" width="900" height="18" fill="#00853D"/>
  <rect x="0" y="570" width="900" height="12" fill="#FFD700"/>
  <rect x="0" y="582" width="900" height="18" fill="#D21034"/>

  <!-- Center Golden Unity Sunburst & Map -->
  <g transform="translate(450, 300)">
    <!-- Radial Glow behind map -->
    <circle cx="0" cy="0" r="210" fill="url(#goldGlow)"/>

    <!-- Outer Laurel/Star Ring for Unity -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="#FFD700" stroke-width="4"/>
    <circle cx="0" cy="0" r="182" fill="none" stroke="#D21034" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Ring of 24 Stars representing Unity & Solidarity -->
    <g fill="#FFD700">
      <!-- 24 small 5-point stars in a ring -->
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(0)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(15)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(30)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(45)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(60)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(75)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(90)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(105)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(120)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(135)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(150)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(165)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(180)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(195)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(210)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(225)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(240)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(255)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(270)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(285)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(300)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(315)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(330)"/>
      <polygon points="0,-182 4,-172 14,-172 6,-166 9,-156 0,-162 -9,-156 -6,-166 -14,-172 -4,-172" transform="rotate(345)"/>
    </g>

    <!-- Center Disc -->
    <circle cx="0" cy="0" r="140" fill="#0A2E1F" stroke="#FFD700" stroke-width="5"/>

    <!-- Stylized Golden African Continent Map Silhouette -->
    <path d="
      M -30 -115
      C -10 -120 25 -110 50 -85
      C 75 -60 85 -30 90 -5
      C 95 15 80 40 65 65
      C 50 90 20 120 5 128
      C -10 135 -18 110 -25 80
      C -30 55 -45 35 -60 20
      C -75 5 -85 -15 -80 -40
      C -75 -65 -60 -85 -45 -100
      Z" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Horn of Africa accent -->
    <path d="M 50 -25 C 80 -10 95 -5 80 20 C 65 15 50 0 50 -25 Z" fill="#FFD700"/>

    <!-- Golden Rays radiating from central map -->
    <circle cx="0" cy="0" r="15" fill="#D21034"/>
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
  </g>

  <!-- Fabric Texture & Waving Overlay -->
  <rect x="0" y="0" width="900" height="600" fill="url(#waveHighlight)" style="mix-blend-mode: overlay;"/>

  <!-- Border -->
  <rect x="0" y="0" width="900" height="600" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="6"/>
</svg>
